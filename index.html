<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sunday Unscary 🎁</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css?v=13" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
</head>
<body class="page-with-topbar">
  <header class="topbar">
    <!-- left spacer keeps title perfectly centered -->
    <span class="spacer" aria-hidden="true"></span>
    <h1 class="title">Sunday Unscaries</h1>
    <!-- optional right-side icon—leave empty or add a subtle info/settings later -->
    <span class="spacer" aria-hidden="true"></span>
  </header>

  <!-- existing Home content -->
  <section id="nonSunday" hidden>
    <img src="assets/abster.jpg" alt="abster" loading="lazy" width="80%" margin="20px" border-radius="15px">
    
    <h1 class="headline">⏳ Next Sunday in <span id="countdown">...</span></h1>
    <button class="btn" id="seeHistory">See history</button>
  </section>

  <canvas id="confetti"></canvas>
  <section id="sundayWelcome" hidden>
    <h1 class="headline">🎉 Happy Sunday!</h1>
    <p class="subtitle">A new unscary is unlocked today.</p>
    <button class="btn primary" id="viewSurprise">View unscary</button>
  </section>

  <!-- <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.v13.js').catch(console.error);
    }
  </script> -->
<!-- at the end of <body>, in this order -->
<script src="config.js" defer></script>
<script src="main.js" defer></script>
</body>
